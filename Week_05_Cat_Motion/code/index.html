<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cat Motion — Webcam Drawing</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#14131b;color:#fff;font:14px system-ui}canvas{display:block;position:fixed;inset:0;z-index:0}header{position:fixed;z-index:2;top:24px;left:28px;right:28px;pointer-events:none}h1{font-size:22px;margin:0 0 5px}header p{margin:0;color:#ded4ef}#controls{position:fixed;z-index:3;bottom:22px;left:24px;right:24px;background:rgba(23,20,33,.88);padding:14px 18px;border:1px solid #ffffff25;border-radius:14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}label{display:flex;gap:8px;align-items:center}input[type=range]{width:100px;accent-color:#d9b2ff}button{border:0;border-radius:8px;padding:10px 14px;background:#e3c6ff;color:#241432;font-weight:600;cursor:pointer}#status{font-size:12px;color:#e0d6e9}body.clean header,body.clean #controls{display:none}#start{position:fixed;z-index:5;inset:0;background:#15121beF;display:grid;place-items:center;text-align:center;padding:24px}#start p{max-width:440px;line-height:1.7;color:#d8cede}#error{color:#ffb6bd;max-width:440px}#start.hidden{display:none}@media(max-width:650px){header{top:12px;left:16px}#controls{left:10px;right:10px;bottom:10px;gap:10px;padding:10px}input[type=range]{width:70px}}</style></head>
<body><header><h1>Cat Motion</h1><p>Move to leave a colourful trail. Pause to let it fade.</p></header>
<div id="controls"><label>Cat size <input id="size" type="range" min="44" max="150" value="90"></label><label>Spacing <input id="spacing" type="range" min="60" max="180" value="110"></label><label>Motion threshold <input id="sensitivity" type="range" min="8" max="65" value="23"></label><label><input id="debug" type="checkbox">Debug</label><button id="clear">Clear</button><button id="full">Full screen</button><span id="status">Camera off · H: hide controls</span></div>
<div id="start"><div><h1>Draw with movement</h1><p>Your camera image stays in this browser. Wave slowly to reveal larger, more widely spaced cats. Stronger movement shifts the marks from lavender towards pink.</p><button id="begin">Start camera</button><p id="error" role="status"></p></div></div>
<script src="vendor/p5.min.js"></script><script src="sketch.js"></script>
<script>window.addEventListener('load',()=>{if(!window.p5)document.getElementById('error').textContent='p5.js did not load. Check your connection and reload.'})</script></body></html>
